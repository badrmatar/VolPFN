[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calibeat-var-es"
version = "0.1.0"
description = "Calibeating the (VaR, ES) pair: an online recalibration wrapper with a no-harm guarantee under Fissler-Ziegel scoring"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools.packages.find]
include = ["calibeat*"]
